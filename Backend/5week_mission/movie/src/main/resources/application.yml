spring:
  application:
    name: "umc-movie"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
