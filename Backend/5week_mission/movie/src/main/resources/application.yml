spring:
  application:
    name: "umc-movie"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET} # 서명용 비밀키(32자 이상). 기본값 없이 환경변수로만 받아요
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600} # Access Token 유효시간(초)
