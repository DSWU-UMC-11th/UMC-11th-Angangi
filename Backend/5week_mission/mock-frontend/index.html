<!-- mock-frontend/index.html -->
<!doctype html>
<html lang="ko">
  <body>
    <h1>간이 프론트 : 닉네임 중복 체크</h1>
    <p>현재 출처: <strong id="origin"></strong></p>
    <button onclick="checkNickname()">'noco'으로 중복 체크</button>
    <p id="result"></p>

    <script>
      document.getElementById("origin").innerText = location.origin;

      async function checkNickname() {
        const result = document.getElementById("result");
        try {
          // Spring이면 8080, NestJS면 3000으로 바꿔서 테스트하세요.
          const res = await fetch("http://localhost:8080/members/nickname/noco");
          const data = await res.json();
          result.innerText = `✅ 응답 성공: ${JSON.stringify(data)}`;
        } catch (error) {
          result.innerText = `❌ 응답을 읽지 못했어요 (Console 탭에서 CORS 에러 확인): ${error.message}`;
        }
      }
    </script>
  </body>
</html>
